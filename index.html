    <!-- Set theme class BEFORE any paint happens, to avoid white flash -->

        try {
          var theme = localStorage.getItem('theme') || 'dark';
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();

    <!-- Critical CSS -->
    <style>
      /* CSS Reset & Base */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }

      /* Default (light) theme */
      html.light body {
        background: #f8fafc;
        color: #0f172a;
      }

      /* Dark theme — matches your app's dark UI immediately, no flash */
      html.dark body {
        background: #0f172a;
        color: #f1f5f9;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        line-height: 1.6;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Loading Screen */
      .loading-container {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 20px;
        background: #0f172a;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      html.light .loading-container {
        background: #f8fafc;
      }

      .loading-container.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loading-logo {
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.02em;
        background: linear-gradient(90deg, #818cf8, #c084fc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(129, 140, 248, 0.2);
        border-top-color: #818cf8;
        animation: spin 0.8s linear infinite;
      }

      .loading-text {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        color: #94a3b8;
        letter-spacing: 0.03em;
      }

      html.light .loading-text {
        color: #64748b;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      html.dark ::-webkit-scrollbar-track {
        background: #1e293b;
      }

      html.dark ::-webkit-scrollbar-thumb {
        background: #4c1d95;
        border-radius: 10px;
        transition: background 0.2s;
      }

      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #6d28d9;
      }

      html.light ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }

      html.light ::-webkit-scrollbar-thumb {
        background: #c4b5fd;
        border-radius: 10px;
        transition: background 0.2s;
      }

      html.light ::-webkit-scrollbar-thumb:hover {
        background: #8b5cf6;
      }

      /* Focus Styles */
      :focus-visible {
        outline: 2px solid #6366F1;
        outline-offset: 2px;
      }

      /* Selection Styles */
      ::selection {
        background: #6366F1;
        color: #ffffff;
      }

      ::-moz-selection {
        background: #6366F1;
        color: #ffffff;
      }

      /* Skip to Content */
      .skip-link {
        position: absolute;
        top: -100%;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: #6366F1;
        color: #ffffff;
        border-radius: 8px;
        z-index: 1000;
        text-decoration: none;
        font-weight: 600;
        transition: top 0.3s;
      }

      .skip-link:focus {
        top: 16px;
      }

      /* Utility Classes */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>

    <!-- Google Analytics (Optional) -->
    <script>
      // Check for consent before loading analytics
      if (localStorage.getItem('analytics-consent') === 'true') {
        (function() {
          const script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX';
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-XXXXXXXXXX');
        })();
      }
    </script>

    <!-- Cookie Consent (Optional) -->
    <script>
      // Simple cookie consent check
      if (!localStorage.getItem('cookie-consent')) {
        // Show cookie banner (to be implemented in React)
        console.log('Cookie consent required');
      }
    </script>
  </head>
  <body>
    <!-- Skip to Content Link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- React mounts directly into this empty root. -->
    <div id="root"></div>

    <!-- Loading screen sits ON TOP of #root (fixed position) so it doesn't
         get wiped out the instant React renders — it's removed deliberately
         via the script below, once the app has actually painted. -->
    <div class="loading-container" id="loading-screen">
      <div class="loading-logo">Xeviqo</div>
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading your experience...</div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Fade out and remove the loading screen once the page has fully
         loaded (images, fonts, etc. included), so the site is fully ready
         to look at the instant the loader disappears. -->
    <script>
      window.addEventListener('load', function () {
        var loader = document.getElementById('loading-screen');
        if (!loader) return;
        // Small delay so the fade feels intentional rather than abrupt.
        setTimeout(function () {
          loader.classList.add('is-hidden');
          setTimeout(function () {
            loader.remove();
          }, 450);
        }, 300);
      });
    </script>

    <!-- Fallback for noscript -->
    <noscript>
      <div style="text-align: center; padding: 60px 20px; font-family: 'Inter', sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="font-size: 64px; margin-bottom: 20px;">🚀</div>
        <h1 style="color: #818cf8; font-size: 42px; margin-bottom: 16px; font-weight: 700;">Xeviqo</h1>
        <p style="font-size: 22px; margin-bottom: 8px;">Learn Today. Build Tomorrow.</p>
        <p style="color: #94a3b8; font-size: 16px; max-width: 400px; margin: 16px auto;">Please enable JavaScript to access this website and explore our training programs.</p>
        <div style="margin-top: 32px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;">
          <a href="#" style="padding: 12px 32px; background: #6366F1; color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">Contact Us</a>
          <a href="#" style="padding: 12px 32px; background: transparent; color: #818cf8; text-decoration: none; border-radius: 8px; font-weight: 600; border: 2px solid #818cf8;">Learn More</a>
        </div>
      </div>
    </noscript>

    <!-- Script to handle service worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registered successfully:', registration.scope);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
